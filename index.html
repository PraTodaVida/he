<title>Controle de Horas Extras</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231f5fa8'/%3E%3Ccircle cx='16' cy='16' r='11' fill='white'/%3E%3Cpath d='M16 8v8l5 3' stroke='%231f5fa8' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070f; --card:rgba(16,22,40,.62); --tx:#e8f1ff; --mut:#8a9bbd; --bd:rgba(0,229,255,.18);
  --pri:#00e5ff; --pri2:#a855f7; --pri-tx:#04121a; --ok:#2dffa8; --bad:#ff4d7d;
  --c50:#00e5ff; --c80:#ffb84d; --c100:#ff4d7d;
  --glow:0 0 18px rgba(0,229,255,.35);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.5 Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
    radial-gradient(900px 500px at 10% -10%, rgba(0,229,255,.16), transparent 60%),
    radial-gradient(800px 500px at 110% 10%, rgba(168,85,247,.18), transparent 60%),
    linear-gradient(rgba(0,229,255,.05) 1px, transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg, rgba(0,229,255,.05) 1px, transparent 1px) 0 0/40px 40px}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:Orbitron,Inter,sans-serif;font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;margin:6px 0 18px;
  background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 svg{filter:drop-shadow(0 0 6px var(--pri))}
h2{font-family:Orbitron,Inter,sans-serif;font-size:12px;font-weight:500;margin:0 0 12px;color:var(--pri);text-transform:uppercase;letter-spacing:.18em}
h2::before{content:"";display:inline-block;width:6px;height:6px;margin-right:8px;vertical-align:middle;background:var(--pri);border-radius:50%;box-shadow:0 0 8px var(--pri)}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04)}
/* painel */
.panel{overflow:hidden;border-color:rgba(0,229,255,.35);box-shadow:0 0 0 1px rgba(168,85,247,.15),0 10px 40px rgba(0,229,255,.12)}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(0,229,255,.06) 50%,transparent 60%);background-size:250% 100%;animation:scan 6s linear infinite}
@keyframes scan{from{background-position:150% 0}to{background-position:-100% 0}}
.panel-in{display:flex;flex-wrap:wrap;align-items:center;gap:28px}
.hero{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;flex:1;min-width:240px}
.big{font-family:Orbitron,Inter,sans-serif;font-size:64px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff,var(--pri) 120%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(0,229,255,.45))}
.big.h{background:linear-gradient(180deg,#fff,var(--pri2) 120%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 14px rgba(168,85,247,.5))}
.big small{font-family:Inter,sans-serif;font-size:16px;font-weight:500;margin-left:6px;-webkit-text-fill-color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .pct{font-family:Orbitron,sans-serif;font-size:22px;font-weight:700}
.ring .sub{font-size:11px;color:var(--mut);letter-spacing:.05em}
#ringArc{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px var(--pri))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.stat{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;background:rgba(0,229,255,.03)}
.stat .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.stat .v{font-family:Orbitron,sans-serif;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
/* formulário */
form.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:6px;text-transform:uppercase;letter-spacing:.08em}
input,select{font:inherit;font-size:15px;color:var(--tx);background:rgba(5,10,22,.8);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;min-width:0;color-scheme:dark;transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--pri);box-shadow:var(--glow)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--c100)}
.chk{flex-direction:row;align-items:center;gap:8px;padding-bottom:10px;font-size:14px;color:var(--tx);text-transform:none;letter-spacing:0}
button{font:inherit;border:1px solid var(--bd);background:rgba(0,229,255,.06);color:var(--tx);border-radius:10px;padding:9px 14px;cursor:pointer;transition:all .2s}
button:hover{border-color:var(--pri);box-shadow:var(--glow)}
button.pri{background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;border:0;font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;padding:11px 20px;box-shadow:0 0 20px rgba(0,229,255,.35)}
button.pri:hover{transform:translateY(-1px);box-shadow:0 0 28px rgba(168,85,247,.55)}
button.del{color:var(--bad);border-color:rgba(255,77,125,.3);background:transparent;padding:0 7px;font-size:13px;line-height:20px}
/* tabela */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid rgba(0,229,255,.08);text-align:left;vertical-align:top}
.tbl th{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.tbl tr:hover td{background:rgba(0,229,255,.04)}
.tbl td.n,.tbl th.n{text-align:right}
.tbl td b{font-family:Orbitron,sans-serif;color:var(--pri);text-shadow:0 0 8px rgba(0,229,255,.5)}
.scroll{overflow-x:auto}
.lista{max-height:340px;overflow-y:auto;margin-top:6px}
.lista .tbl td:first-child,.lista .tbl th:first-child{width:200px}
.lista .tbl th{position:sticky;top:0;background:#0b1120;z-index:1}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid currentColor;box-shadow:0 0 8px currentColor inset}
.t50{color:var(--c50)} .t80{color:var(--c80)} .t100{color:var(--c100)}
.mut{color:var(--mut);font-size:12px}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.err{color:var(--bad)} .okm{color:var(--ok)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
details summary{cursor:pointer;color:var(--mut);font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:.15em;text-transform:uppercase}
html{-webkit-text-size-adjust:100%}
button,input,label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(40px,env(safe-area-inset-bottom))}
@media (max-width:640px){
  .wrap{padding-top:max(14px,env(safe-area-inset-top))}
  h1{font-size:16px;margin:2px 0 12px}
  .card{padding:14px;border-radius:14px;margin-bottom:12px}
  .panel-in{flex-wrap:nowrap;gap:12px;justify-content:space-between}
  .hero{flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
  .big{font-size:52px}
  .big.h{font-size:34px}
  .big small{font-size:13px}
  .ring{width:104px;height:104px}
  .ring .pct{font-size:18px}
  .ring .sub{font-size:10px}
  form.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .f-data,.f-fer,.f-btn{grid-column:1/-1}
  input{font-size:16px;padding:12px;min-height:48px;width:100%}
  .f-fer{padding:4px 0}
  input[type=checkbox]{width:22px;height:22px;min-height:0}
  button.pri{min-height:52px;font-size:15px;width:100%}
  button.del{min-width:32px;min-height:32px;font-size:16px;margin-left:6px}
  .lista{max-height:none}
  .lista .tbl td:first-child,.lista .tbl th:first-child{width:auto}
  .lista .tbl td{font-size:15px;padding:10px 6px}
  .lista .tbl td:last-child{text-align:right;line-height:2.2}
  .lista .tbl th:last-child{text-align:right}
}
@media (max-width:360px){ .big{font-size:44px} .big.h{font-size:28px} .ring{width:88px;height:88px} }
@media (prefers-reduced-motion:reduce){ .panel::after{animation:none} #ringArc{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <h1 style="display:flex;align-items:center;gap:8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--pri)" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Controle de Horas Extras</h1>

  <!-- PAINEL -->
  <div class="card panel">
    <h2>Painel</h2>
    <div class="panel-in">
      <div class="hero">
        <div class="big" id="pDias">0<small>dias</small></div>
        <div class="big h" id="pHoras">0,0<small>h</small></div>
      </div>
      <div class="ring" title="Progresso para o próximo dia">
        <svg width="100%" height="100%" viewBox="0 0 120 120">
          <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
          <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(0,229,255,.12)" stroke-width="10"/>
          <circle id="ringArc" cx="60" cy="60" r="50" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16"/>
        </svg>
        <div class="lbl"><div class="pct" id="rPct">0%</div><div class="sub">próximo dia</div></div>
      </div>
    </div>
  </div>

  <!-- LANÇAMENTO -->
  <div class="card">
    <h2>Lançar marcação</h2>
    <form class="row" id="fLanc">
      <label class="f-data">Data<input type="date" id="iData" required></label>
      <label class="f-hora">Entrada<input type="time" id="iEnt" required></label>
      <label class="f-hora">Saída<input type="time" id="iSai" required></label>
      <label class="chk f-fer"><input type="checkbox" id="iFer"> Feriado (100%)</label>
      <button class="pri f-btn" type="submit">Lançar</button>
    </form>
    <div class="msg" id="mLanc"></div>
    <div class="scroll lista"><table class="tbl" id="tDias"></table></div>
  </div>

  <!-- CONFIG -->
  <div class="card">
    <details>
      <summary>Configuração e backup</summary>
      <div style="height:10px"></div>
      <form class="row" id="fCfg">
        <label>Dias trabalhados (saldo inicial)<input type="number" id="cDias" min="0" step="1"></label>
        <label>Horas além dos dias (saldo inicial)<input type="number" id="cHoras" min="0" step="0.1"></label>
        <label>Jornada diária (h)<input type="number" id="cJor" min="1" step="0.1"></label>
        <label>Carga mensal (h)<input type="number" id="cMes" min="1" step="1"></label>
        <label>Seg–Sex extra (%)<input type="number" id="c50" min="0" step="1"></label>
        <label>Sábado (%)<input type="number" id="c80" min="0" step="1"></label>
        <label>Domingo/Feriado (%)<input type="number" id="c100" min="0" step="1"></label>
        <button class="pri" type="submit">Salvar</button>
      </form>
      <div class="msg" id="mCfg"></div>
      <div class="bar">
        <button id="bExp" type="button">Exportar backup (.json)</button>
        <label class="chk" style="padding:0"><button type="button" id="bImpBtn">Importar backup</button><input type="file" id="bImp" accept=".json,application/json" hidden></label>
        <button id="bCsv" type="button">Exportar lançamentos (.csv)</button>
      </div>
      <p class="mut">Os dados ficam salvos só neste navegador/aparelho. Faça backup com frequência e importe no outro aparelho se quiser usar em mais de um.</p>
    </details>
  </div>
</div>

<script>
(function(){
"use strict";
const KEY = "rodopar_horas_extras_v1";
const DEF = { cfg:{ diasBase:172, horasBase:0, jornada:8.8, cargaMes:220, p50:50, p80:80, p100:100 }, lanc:[], feriados:[] };

let st;
function load(){
  try{ const r = localStorage.getItem(KEY); st = r ? JSON.parse(r) : null; }catch(e){ st = null; }
  if(!st || !st.cfg) st = JSON.parse(JSON.stringify(DEF));
  st.cfg = Object.assign({}, DEF.cfg, st.cfg);
  st.lanc = st.lanc || []; st.feriados = st.feriados || [];
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){ alertMsg("mLanc","Não foi possível salvar no navegador. Exporte o backup.",true); } }

// ---------- utilitários (tudo em minutos inteiros p/ evitar erro de arredondamento) ----------
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const jorMin = () => Math.round(st.cfg.jornada*60);
const fmtH = min => (min/60).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:2});
const fmtHM = min => { const s = min<0?"-":""; min=Math.abs(Math.round(min)); return s+String(Math.floor(min/60)).padStart(2,"0")+":"+String(min%60).padStart(2,"0"); };
const DIAS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const dow = d => new Date(d+"T12:00:00").getDay();
const fmtD = d => d.split("-").reverse().join("/");
function durMin(l){ let a=toMin(l.ent), b=toMin(l.sai); if(b<=a) b+=1440; return b-a; }
function tipoDia(d){
  if(st.feriados.includes(d)) return "fer";
  const w = dow(d); return w===0?"dom":(w===6?"sab":"util");
}

// agrega por dia
function porDia(){
  const m = {};
  for(const l of st.lanc){ (m[l.data] ||= []).push(l); }
  const out = [];
  for(const d of Object.keys(m).sort()){
    const ls = m[d].sort((a,b)=>a.ent.localeCompare(b.ent));
    const tot = ls.reduce((s,l)=>s+durMin(l),0);
    const t = tipoDia(d);
    let normal=0, e50=0, e80=0, e100=0;
    if(t==="util"){ normal=Math.min(tot,jorMin()); e50=Math.max(0,tot-jorMin()); }
    else if(t==="sab"){ e80=tot; }
    else { e100=tot; }
    const c=st.cfg;
    const conta = normal + e50*(1+c.p50/100) + e80*(1+c.p80/100) + e100*(1+c.p100/100);
    out.push({data:d, ls, tot, tipo:t, normal, e50, e80, e100, conta});
  }
  return out;
}

// ---------- render ----------
function render(){
  const c = st.cfg, J = jorMin();
  const dias = porDia();
  const totLanc = dias.reduce((s,d)=>s+d.conta,0);
  const totReal = dias.reduce((s,d)=>s+d.tot,0);
  const totalMin = c.diasBase*J + Math.round(c.horasBase*60) + totLanc;
  const nDias = Math.floor(totalMin/J), resto = totalMin - nDias*J;
  document.getElementById("pDias").innerHTML = nDias+"<small>dias</small>";
  document.getElementById("pHoras").innerHTML = fmtH(resto)+"<small>h</small>";
  const fr = resto/J; rPct.textContent = Math.floor(fr*100)+"%";
  ringArc.style.strokeDashoffset = (314.16*(1-fr)).toFixed(2);
  // lista de marcações
  const tb = document.getElementById("tDias");
  if(!dias.length){ tb.innerHTML = ""; return; }
  let h = `<tr><th>Data</th><th>Marcações</th></tr>`;
  for(const d of [...dias].reverse()){
    const marc = d.ls.map(l=>`${l.ent}–${l.sai}${toMin(l.sai)<=toMin(l.ent)?" (+1d)":""} <button class="del" title="Excluir" data-id="${l.id}">×</button>`).join("<br>");
    h += `<tr><td>${fmtD(d.data)} <span class="mut">${DIAS[dow(d.data)]}</span></td><td>${marc}</td></tr>`;
  }
  tb.innerHTML = h;

  // mês
}

function alertMsg(id,txt,err){ const e=document.getElementById(id); e.textContent=txt; e.className="msg "+(err?"err":"okm"); }

// ---------- eventos ----------
document.getElementById("fLanc").addEventListener("submit", ev=>{
  ev.preventDefault();
  const data=iData.value, ent=iEnt.value, sai=iSai.value;
  if(!data||!ent||!sai) return;
  if(ent===sai){ alertMsg("mLanc","Entrada e saída iguais.",true); return; }
  const novo={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), data, ent, sai};
  // checa sobreposição no mesmo dia
  const a=toMin(ent), b=a+durMin(novo);
  const conflito = st.lanc.some(l=>{ if(l.data!==data) return false; const x=toMin(l.ent), y=x+durMin(l); return a<y && x<b; });
  if(conflito){ alertMsg("mLanc","Esse intervalo se sobrepõe a outro lançamento do mesmo dia.",true); return; }
  st.lanc.push(novo);
  const f = st.feriados.indexOf(data);
  if(iFer.checked && f<0) st.feriados.push(data);
  if(!iFer.checked && f>=0) st.feriados.splice(f,1);
  save();
  render();
  alertMsg("mLanc",`Lançado ${fmtD(data)} ${ent}–${sai} (${fmtH(durMin(novo))} h).`);
  iEnt.value=""; iSai.value="";
  if(data!==hojeISO()) setHoje(); // lançou dia passado: volta para hoje
});
iData.addEventListener("change", ()=>{ iFer.checked = st.feriados.includes(iData.value); });


function fillCfg(){ const c=st.cfg; cDias.value=c.diasBase; cHoras.value=c.horasBase; cJor.value=c.jornada; cMes.value=c.cargaMes; c50.value=c.p50; c80.value=c.p80; c100.value=c.p100; }
document.getElementById("fCfg").addEventListener("submit", ev=>{
  ev.preventDefault();
  const n = v => Number(String(v).replace(",","."));
  const c = { diasBase:n(cDias.value), horasBase:n(cHoras.value), jornada:n(cJor.value), cargaMes:n(cMes.value), p50:n(c50.value), p80:n(c80.value), p100:n(c100.value) };
  if(Object.values(c).some(v=>!isFinite(v)||v<0) || c.jornada<=0){ alertMsg("mCfg","Valores inválidos.",true); return; }
  st.cfg=c; save(); render(); alertMsg("mCfg","Configuração salva.");
});

function baixar(nome, txt, tipo){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:tipo})); a.download=nome; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
bExp.addEventListener("click", ()=> baixar(`horas-extras-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(st,null,2), "application/json"));
bImpBtn.addEventListener("click", ()=> bImp.click());
bImp.addEventListener("change", ()=>{
  const f=bImp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.cfg||!Array.isArray(d.lanc)) throw 0;
      if(!confirm("Substituir todos os dados atuais pelo backup?")) return;
      st={ cfg:Object.assign({},DEF.cfg,d.cfg), lanc:d.lanc, feriados:d.feriados||[] };
      save(); fillCfg(); render(); alertMsg("mCfg","Backup importado.");
    }catch(e){ alertMsg("mCfg","Arquivo de backup inválido.",true); } bImp.value=""; };
  r.readAsText(f);
});
bCsv.addEventListener("click", ()=>{
  const c=st.cfg;
  const rows=[["Data","Dia","Marcacoes","Total_h","Normal_h","Extra50_h","Extra80_h","Extra100_h","Contabilizado_h"]];
  for(const d of porDia()){
    rows.push([fmtD(d.data),DIAS[dow(d.data)],d.ls.map(l=>l.ent+"-"+l.sai).join(" | "),fmtH(d.tot),fmtH(d.normal),fmtH(d.e50),fmtH(d.e80),fmtH(d.e100),fmtH(d.conta)]);
  }
  baixar(`horas-extras-${hojeISO()}.csv`, "﻿"+rows.map(r=>r.map(x=>`"${x}"`).join(";")).join("\n"), "text/csv");
});

document.getElementById("tDias").addEventListener("click", ev=>{
  const id = ev.target.dataset && ev.target.dataset.id; if(!id) return;
  const l = st.lanc.find(x=>x.id===id); if(!l) return;
  if(!confirm(`Excluir ${fmtD(l.data)} ${l.ent}–${l.sai}?`)) return;
  st.lanc = st.lanc.filter(x=>x.id!==id);
  if(!st.lanc.some(x=>x.data===l.data)) st.feriados = st.feriados.filter(f=>f!==l.data);
  save(); render();
});

// ---------- data de hoje ----------
let diaAtual = "";
function hojeISO(){ const h=new Date(); return new Date(h.getTime()-h.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function setHoje(){
  diaAtual = hojeISO();
  iData.value = diaAtual;
  iFer.checked = st.feriados.includes(diaAtual);
  render();
}

// ---------- init ----------
load();
fillCfg(); setHoje();
// data automática: muda sozinha na virada do dia e ao voltar para o app
setInterval(()=>{ if(hojeISO()!==diaAtual) setHoje(); }, 30000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && hojeISO()!==diaAtual) setHoje(); });
window.addEventListener("focus", ()=>{ if(hojeISO()!==diaAtual) setHoje(); });
})();
</script>
